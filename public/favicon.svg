<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d2417" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050806" stop-opacity="1"/>
    </radialGradient>

    <!-- First 'A' Gradient (Emerald to Crisp White) -->
    <linearGradient id="firstA" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Second 'A' Gradient (Gold to Amber) -->
    <linearGradient id="secondA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="64" height="64" rx="16" fill="#050806"/>

  <!-- Inner Ambient Glow Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#innerGlow)"/>

  <!-- Subtle Outer Gradient Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Monogram AA Typography -->
  <!-- First 'A' -->
  <text
    x="18"
    y="44"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="31"
    font-weight="900"
    fill="url(#firstA)"
  >A</text>

  <!-- Second 'A' -->
  <text
    x="38"
    y="44"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="31"
    font-weight="900"
    fill="url(#secondA)"
  >A</text>

  <!-- Interactive Terminal Green Active Status Dot -->
  <circle cx="53" cy="42" r="3.2" fill="#10b981"/>
  <circle cx="53" cy="42" r="1.5" fill="#a7f3d0"/>
</svg>
