<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Base Dark Canvas -->
  <rect width="64" height="64" rx="16" fill="#0a0a0a"/>

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Monogram AA Typography with Solid Colors -->
  <!-- First 'A' (Green highlight) -->
  <text
    x="18"
    y="44"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="31"
    font-weight="900"
    fill="#22c55e"
  >A</text>

  <!-- Second 'A' (Gold accent) -->
  <text
    x="38"
    y="44"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="31"
    font-weight="900"
    fill="#c9a84c"
  >A</text>
</svg>
